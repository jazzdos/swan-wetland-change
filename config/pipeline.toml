[stac]
endpoint = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-c1-l2a"
cloud_cover_max = 20.0
watermark_overlap_days = 1
initial_lookback_days = 30
required_assets = ["green", "red", "nir", "swir16", "scl", "product_metadata"]

[aoi]
ramsar_path = "data/external/dbca_010_ramsar_sites.geojson"
waterbodies_path = "data/external/dea_waterbodies_v3_swan.geojson"
site_prefixes = [
    "Forrestdale & Thomsons Lakes",
    "Peel-Yalgorup System",
    "Becher Point Wetlands",
    "Ellen Brook",
]
operation_epsg = 32750

[water]
method = "mndwi"
threshold = -0.1
agreement_min = 0.91
min_valid_fraction = 0.8

# Per-polygon overrides: LEARNINGS.md "Per-polygon water calibration" and
# docs/decisions/0005-per-polygon-water-settings.md. scl6 means SCL class 6
# and takes no threshold. ramsar-12 has no override and stays on the global
# setting: docs/decisions/0010-ramsar-12-water-setting.md.
[water.overrides.ramsar-15]
method = "scl6"
agreement_min = 0.94

[water.overrides.ramsar-28]
method = "ndwi"
threshold = -0.15
agreement_min = 0.92

[water.overrides.ramsar-56]
method = "mndwi"
threshold = 0.05
agreement_min = 0.95

[output]
root = "outputs"

[catalogue]
# The `bucket_url` output of infra (no trailing slash), set at the 2026-11-06
# apply. `run` and `build-catalogue` refuse an s3:// output root while this is
# a `.invalid` host. The bucket is private (ADR 0011), so these links need
# signed access.
base_url = "https://swan-wetland-change-outputs-263051716913.s3.ap-southeast-2.amazonaws.com"

[verify]
# WO and NDVI checks skip a polygon with fewer mutually clear pixels than this.
# Pixels are 10 m, so 100 is 1 ha.
min_clear_pixels = 100

# Water extent, history: LEARNINGS.md "S9 historical tolerance" chose 10 pp.
[verify.waterbodies]
# The Spearman check scores every stored pass up to the newest scene of the verified run.
tolerance_pp = 10.0
max_day_gap = 3
# Calibrated from the whole stored history (lowest per-lake rho minus 0.02, rounded
# down); see docs/decisions/0007-spearman-threshold-from-whole-history.md.
spearman_min = 0.83
spearman_min_pairs = 10
