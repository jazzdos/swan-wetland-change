[stac]
endpoint = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-c1-l2a"
cloud_cover_max = 20.0
watermark_overlap_days = 1
required_assets = ["green", "red", "nir", "swir16", "scl", "product_metadata"]

[aoi]
ramsar_path = "data/external/dbca_010_ramsar_sites.geojson"
waterbodies_path = "data/external/dea_waterbodies_v3_swan.geojson"
site_prefixes = [
    "Forrestdale & Thomsons Lakes",
    "Peel-Yalgorup System",
    "Becher Point Wetlands",
    "Ellen Brook",
]
operation_epsg = 32750

[water]
method = "mndwi"
threshold = -0.1
agreement_min = 0.91
min_valid_fraction = 0.8

# Per-polygon overrides: LEARNINGS.md "Per-polygon water calibration" and
# docs/decisions/0005-per-polygon-water-settings.md. scl6 means SCL class 6
# and takes no threshold.
[water.overrides.ramsar-15]
method = "scl6"
agreement_min = 0.94

[water.overrides.ramsar-28]
method = "ndwi"
threshold = -0.15
agreement_min = 0.92

[water.overrides.ramsar-56]
method = "mndwi"
threshold = 0.05
agreement_min = 0.95

[output]
root = "outputs"

[catalogue]
base_url = "https://example.invalid/swan-wetland-change"
