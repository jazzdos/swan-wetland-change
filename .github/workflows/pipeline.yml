# Daily pipeline: fetch the AOI, run the incremental change-detection run
# against the S3 output store, verify the run against the independent
# references, verify by id any earlier crashed run this run finished (its
# manifest lists them in recovered_runs), build the catalogue, and commit the
# verification reports.
# `run` is called with --no-catalogue, so the single catalogue build is the
# step after verify. It runs on every day that is not cancelled, including a
# day with no processed scenes and a day when verify failed, so the catalogue
# links reports written by verify.yml and by any CLI backfill. The build is
# incremental: a day with nothing new costs one ledger read and writes no
# catalogue objects.
#
# Runs at 10:17 UTC every day and on manual dispatch. The minute is not zero
# because GitHub delays scheduled runs at the top of the hour.
#
# Why it commits the verification report: GitHub disables scheduled
# workflows after 60 days without repository activity. The daily commit of
# docs/research/verification-<run_id>.md counts as activity, so the schedule
# keeps running. The reports of recovered runs are committed in the same step. The commit step runs even when verify exits non-zero, so a
# failing verification is recorded and does not block it; the job still ends
# red in that case.
#
# AWS access is through OIDC. The IAM role trusts only runs on
# refs/heads/main, so the workflow only works from main. The role ARN, region
# and bucket name come from repository variables (not secrets); no
# long-lived credentials are stored anywhere.
#
# When a scheduled run does not succeed, alert.yml opens or updates a GitHub
# issue.

name: pipeline

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: two overlapping runs would both write the same store.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: run, catalogue, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Widened from the workflow default for this job only: `contents: write`
    # pushes the report commit, `id-token: write` mints the OIDC token.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.29"
          python-version: "3.12"
          enable-cache: false

      - name: Install the project
        run: uv sync --locked

      # Exports AWS credentials as environment variables, which pyarrow's
      # S3FileSystem reads for `s3://` output roots.
      - name: Assume the AWS role through OIDC
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Must equal max_session_duration on the role in infra/main.tf.
          role-duration-seconds: 10800

      - name: Fetch the AOI
        run: uv run --no-sync python scripts/fetch_aoi.py

      # The manifest goes to a file by redirect, not a pipe, so the exit code
      # of `run` (2 when any scene failed) fails this step. `run` still writes
      # the manifest when scenes failed, so the later steps read it anyway.
      - name: Run the incremental pipeline
        id: run
        run: >-
          uv run --no-sync wetland-change run
          --output-root s3://${{ vars.OUTPUT_BUCKET }}/
          --no-catalogue
          > "$RUNNER_TEMP/run-manifest.json"

      # `!cancelled()` drops the implicit success(), so this step runs after a
      # failed `run` step. If `run` crashed before writing a manifest, the
      # file is empty or missing, `processed` is 0 and `recovered` is empty.
      # `recovered` is the space-separated run ids from the manifest's
      # recovered_runs list: earlier crashed runs this run finished.
      - name: Read the processed scene count and recovered runs
        id: manifest
        if: ${{ !cancelled() }}
        run: |
          manifest="$RUNNER_TEMP/run-manifest.json"
          processed=0
          recovered=""
          if [ -s "$manifest" ]; then
            cat "$manifest"
            processed="$(jq -r '.processed // 0' "$manifest" || echo 0)"
            recovered="$(jq -r '(.recovered_runs // []) | join(" ")' "$manifest" || echo "")"
          fi
          echo "processed=${processed}" >> "$GITHUB_OUTPUT"
          echo "recovered=${recovered}" >> "$GITHUB_OUTPUT"

      # Verify runs only when this run processed scenes, even if some other
      # scenes failed. Otherwise it would re-check an old run (or fail when no
      # processed run exists yet). Recovered runs are verified by id in the
      # next step, and the commit step also hangs on them. The catalogue step
      # below hangs on neither, so it also runs on a zero-processed day.
      - name: Verify the run
        if: ${{ !cancelled() && steps.manifest.outputs.processed > 0 }}
        run: >-
          uv run --no-sync wetland-change verify
          --output-root s3://${{ vars.OUTPUT_BUCKET }}/

      # A run that finished a crashed earlier run lists it in recovered_runs.
      # `verify` defaults to the newest run with processed scenes, so the
      # recovered runs are verified by id here. Every id is attempted, and the
      # step exits with the highest non-zero verify exit code, so the job ends
      # red but one failing run does not skip the others. Exit 4 (nothing
      # scored) is not a failure: a crashed run can be recovered from ledger
      # rows that are all rejected or failed, so its manifest has processed 0
      # and verify scores nothing, the same day the step above is skipped.
      # That case is logged and leaves the status unchanged; exits 2, 3, 5
      # and 6 still count. The ids come from the manifest through an env var,
      # not from interpolation into the script.
      - name: Verify the runs this run recovered
        if: ${{ !cancelled() && steps.manifest.outputs.recovered != '' }}
        env:
          RECOVERED_RUNS: ${{ steps.manifest.outputs.recovered }}
        run: |
          : "${RECOVERED_RUNS:?no recovered run ids}"
          status=0
          for run_id in $RECOVERED_RUNS; do
            echo "verifying recovered run ${run_id}"
            if uv run --no-sync wetland-change verify \
              --output-root "s3://${{ vars.OUTPUT_BUCKET }}/" \
              --run-id "$run_id"; then
              :
            else
              code=$?
              if [ "$code" -eq 4 ]; then
                echo "nothing to verify for recovered run ${run_id}"
              elif [ "$code" -gt "$status" ]; then
                status=$code
              fi
            fi
          done
          exit "$status"

      # The only catalogue build in the workflow: `run` skips it, so the
      # catalogue is built once, after verify has written its report. The
      # condition does not reference verify's outcome or the processed count,
      # so a red verify or a day with no processed scenes still gets a
      # catalogue that links any report written since the last build.
      - name: Build the catalogue so it links the verification report
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync wetland-change build-catalogue
          --output-root s3://${{ vars.OUTPUT_BUCKET }}/

      # The condition does not reference verify's outcome, so this step still
      # runs when verify exits non-zero (the job then ends red). It commits on
      # a day that processed scenes or recovered runs, so the reports of the
      # recovered runs are not lost with the runner. The push
      # rebases onto main first because the job can run for up to 120 minutes
      # on a depth-1 checkout, and main may have moved; one retry covers a
      # push that lands between the rebase and the push.
      - name: Commit the verification report
        if: ${{ !cancelled() && (steps.manifest.outputs.processed > 0 || steps.manifest.outputs.recovered != '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- docs/research
          if git diff --cached --quiet; then
            echo "no verification report to commit"
          else
            git commit -m "Verification report for ${GITHUB_RUN_ID}"
            for attempt in 1 2; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              echo "push attempt ${attempt} failed"
            done
            exit 1
          fi
