# Weekly verify: run the live contract tests, verify the latest daily run in the S3
# output store against the independent references, and check freshness. Any
# scheduled run that does not succeed is reported by alert.yml, which opens or
# updates a GitHub issue that links to the workflow run.
#
# Runs at 22:43 UTC every Sunday and on manual dispatch. The time is clear of
# the 10:17 UTC daily pipeline, which has a 120 minute limit.
#
# This is the check that notices problems. The daily pipeline commits its
# verification report, which keeps the schedule alive but does not notify
# anyone; when this workflow's scheduled run does not succeed, alert.yml opens
# an issue.
#
# AWS access is through OIDC. The IAM role trusts only runs on
# refs/heads/main, so workflow_dispatch only works from main. The role ARN,
# region and bucket name come from repository variables (not secrets); no
# long-lived credentials are stored anywhere. The credentials are assumed
# after the live tests, which read public COGs unsigned and need none.
#
# Access to the bucket is not read-only. The role can write, and `verify`
# writes `verification/<run_id>.json` for the run it checks, overwriting the
# pipeline's copy in the private, unversioned bucket. The design accepts that
# write; the catalogue links the file as the run's record. This workflow
# shares the `pipeline` concurrency group so the write never overlaps a
# pipeline run.
#
# Timeouts. Each long step has its own `timeout-minutes`, so a hung step
# fails with its own name in the log: 5 + 15 + 20 + 5 = 45 minutes of the 60
# minute job limit. Checkout, install and the credential step have no step
# timeout; if one of them hangs past the remaining 15 minutes, the job limit
# ends the run. A job-level timeout is covered by alert.yml, which reads the
# conclusion of the finished run.

name: verify

on:
  schedule:
    - cron: "43 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, shared with the daily pipeline, and never cancel a run
# part-way through.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  verify:
    name: live contract, verify, freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Widened from the workflow default for this job only.
    permissions:
      # Check out the repository.
      contents: read
      # Mint the OIDC token for the AWS role.
      id-token: write

    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv and Python
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.29"
          python-version: "3.12"
          enable-cache: false

      - name: Install the project
        run: uv sync --locked

      - name: Fetch the AOI
        timeout-minutes: 5
        run: uv run --no-sync python scripts/fetch_aoi.py

      # `-m live` on the command line overrides the default `-m 'not live'`
      # from pyproject.toml.
      - name: Live contract tests
        timeout-minutes: 15
        run: uv run --no-sync pytest -m live -rs

      # Exports AWS credentials as environment variables, which pyarrow's
      # S3FileSystem reads for `s3://` output roots. Only verify and
      # freshness need them. `!cancelled()` keeps them available after a
      # failed live test.
      - name: Assume the AWS role through OIDC
        id: aws
        if: ${{ !cancelled() }}
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `!cancelled()` drops the implicit success(), so verify and freshness
      # still run after a failed earlier step and every problem shows up in
      # one run. The job still ends red.
      - name: Verify the latest daily run
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: >-
          uv run --no-sync wetland-change verify
          --output-root s3://${{ vars.OUTPUT_BUCKET }}/

      - name: Check freshness
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: >-
          uv run --no-sync wetland-change freshness
          --output-root s3://${{ vars.OUTPUT_BUCKET }}/
